<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل العقار | FloEstates</title>
<meta name="description" content="تفاصيل العقار الكاملة: معرض صور، مواصفات، مميزات، الموقع، وبيانات التواصل مع FloEstates.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo"><span class="mark"><i class="fa-solid fa-building-columns"></i></span><div><b>Flo</b><span>Estates</span></div></a>
    <nav class="menu">
      <a href="projects.html">المشاريع</a>
      <a href="resale.html">إعادة البيع</a>
      <a href="lands.html">الأراضي</a>
      <a href="offers.html" class="hot">العروض</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html">اتصل بنا</a>
    </nav>
    <div class="nav-right">
      
      <button class="icon-btn" title="اللغة"><i class="fa-solid fa-language"></i></button>
      <a href="contact.html" class="btn"><i class="fa-solid fa-envelope"></i> تواصل معنا</a>
      <button class="burger"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<main id="propRoot"><!-- يُملأ ديناميكياً --></main>

<div id="footer"></div>
<a href="https://wa.me/905496068080" class="wa" title="تواصل عبر واتساب"><i class="fa-brands fa-whatsapp"></i></a>
<script src="assets/properties.js"></script>
<script src="assets/app.js"></script>
<script src="assets/footer.js"></script>
<script>
(function(){
  const P=window.PROPERTIES, D=window.DISTRICTS, C=window.CATS;
  const params=new URLSearchParams(location.search);
  let id=params.get('id');
  if(!id || !P[id]) id='SH290';
  const p=P[id];
  const imgUrl=n=>'assets/img/'+n+'.webp';
  const cat=C[p.cat];

  document.title=p.ref+' - '+p.title+' | FloEstates';

  // badges
  const badges=(p.badges||[]).map(b=>`<span class="chip ${b[1]}">${b[0]}</span>`).join('');

  // price line
  const priceLabel=p.priceLabel?`<span style="font-size:.9rem;color:#9aa7ad">${p.priceLabel}</span> `:'';
  const unit=p.unit?`<span style="font-size:1rem">${p.unit}</span>`:'';

  // quickbar
  let quick='';
  if(p.cat==='land'){
    quick=`
      <div class="qitem"><i class="fa-solid fa-vector-square"></i><div class="v">${p.area}</div><div class="k">المساحة</div></div>
      <div class="qitem"><i class="fa-solid fa-mountain-sun"></i><div class="v">${p.landtype}</div><div class="k">نوع الأرض</div></div>
      <div class="qitem"><i class="fa-solid fa-money-bill-wave"></i><div class="v">${p.price}</div><div class="k">${p.unit}</div></div>
      <div class="qitem"><i class="fa-solid fa-id-badge"></i><div class="v">${p.ref}</div><div class="k">المرجع</div></div>`;
  }else{
    quick=`
      <div class="qitem"><i class="fa-solid fa-bed"></i><div class="v">${p.rooms||'-'}</div><div class="k">الغرف</div></div>
      <div class="qitem"><i class="fa-solid fa-vector-square"></i><div class="v">${p.area||'-'}</div><div class="k">المساحة</div></div>
      <div class="qitem"><i class="fa-solid fa-bath"></i><div class="v">${p.baths||'-'}</div><div class="k">الحمامات</div></div>
      <div class="qitem"><i class="fa-solid fa-building"></i><div class="v">${p.type||'-'}</div><div class="k">النوع</div></div>`;
  }

  // description by category
  const shortTitle=p.title.split(' - ').slice(-1)[0];
  let desc='';
  if(p.cat==='land'){
    desc=`<p>${p.title} — قطعة أرض ${p.landtype} بموقع استراتيجي في ${p.loc}، تمثل فرصة استثمارية واعدة بعوائد مرتفعة.</p><p style="margin-top:14px">تتميز الأرض بسهولة الوصول وقربها من الخدمات والبنية التحتية، مع تعامل حصري يسهّل عليك التفاوض وإتمام الشراء بأمان وشفافية.</p>`;
  }else if(p.cat==='project'){
    desc=`<p>${p.title} — مشروع عقاري متكامل في ${p.loc} يوفر وحدات سكنية بتصاميم عصرية ومساحات متنوعة (${p.area})، مع خدمات متكاملة وخطط دفع مرنة.</p><p style="margin-top:14px">موقع استراتيجي قريب من المواصلات والخدمات، وفرص إعادة بيع ذات أرباح عالية عند التسليم. ${p.discount?'يتوفر حالياً '+p.discount+' عند الدفع النقدي.':''}</p>`;
  }else if(p.cat==='offer'){
    desc=`<p>${p.title} — عرض حصري بـ${p.discount} وخطط دفع مرنة في ${p.loc}. فرصة محدودة بأفضل سعر وعائد استثماري مضمون.</p><p style="margin-top:14px">وحدة بمواصفات ممتازة (${p.area}) ضمن موقع حيوي، مع ضمان حفظ الحقوق والسرية التامة في كل صفقة.</p>`;
  }else{
    desc=`<p>${p.title} — عقار حصري جاهز في ${p.loc} بتشطيبات عالية الجودة ومساحات مدروسة (${p.area}) توفر الراحة والخصوصية.</p><p style="margin-top:14px">ضمن موقع حيوي قريب من الخدمات والمواصلات، يمثّل فرصة مثالية للسكن أو الاستثمار مع ضمان حفظ الحقوق والسرية التامة.</p>`;
  }

  // amenities
  const amenB=['حديقة ومسطحات خضراء','موقف سيارات','مطبخ مجهز','تدفئة مركزية','نظام أمان 24/7','كاميرات مراقبة','صالة رياضية','قرب المواصلات','تشطيب ديلوكس'];
  const amenL=['طابو جاهز','خدمات متوفرة (ماء/كهرباء)','قرب الطريق السريع','موقع استثماري','إطلالة مفتوحة','سهولة الوصول'];
  const amen=(p.cat==='land'?amenL:amenB).map(a=>`<li><i class="fa-solid fa-circle-check"></i> ${a}</li>`).join('');

  // details table
  let rows=[['نوع العقار',p.type]];
  if(p.cat==='land'){rows.push(['نوع الأرض',p.landtype],['المساحة',p.area],['سعر المتر',p.price+' '+p.unit],['الأهلية للجنسية','مؤهل']);}
  else{
    rows.push(['حالة العقار', p.cat==='project'?'مشروع قيد الإنشاء / تسليم '+(p.delivery||''):'جاهز للسكن']);
    if(p.rooms)rows.push(['عدد الغرف',p.rooms]);
    rows.push(['المساحة',p.area]);
    if(p.payment)rows.push(['طريقة الدفع',p.payment]);
    if(p.discount)rows.push(['الخصم',p.discount]);
    if(p.rating)rows.push(['التقييم','⭐ '+p.rating]);
    rows.push(['الأهلية للجنسية','مؤهل']);
  }
  const detailRows=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');

  // gallery thumbs: main + generic interiors (dedup)
  const pool=[p.img,'p10','p12','p24','p20'];
  const thumbs=[...new Set(pool)].slice(0,4);
  const thumbHtml=thumbs.map((t,i)=>`<img class="${i===0?'active':''}" src="${imgUrl(t)}" onclick="swap(this)" alt="">`).join('');

  // map
  const dd=D[p.district]||[41.0,28.9];
  const bbox=(dd[1]-0.04)+'%2C'+(dd[0]-0.03)+'%2C'+(dd[1]+0.04)+'%2C'+(dd[0]+0.03);
  const marker=dd[0]+'%2C'+dd[1];

  // similar: same category, other ids
  const sims=Object.values(P).filter(x=>x.cat===p.cat && x.ref!==p.ref).slice(0,3);
  const simHtml=sims.map(s=>`
    <a href="property.html?id=${s.ref}" class="pcard">
      <div class="ph"><span class="badge excl">${(s.badges&&s.badges[0]?s.badges[0][0]:'حصري')}</span><img src="${imgUrl(s.img)}" alt=""></div>
      <div class="pbody">
        <div class="price">${s.price} <small style="font-size:.7rem">${s.unit}</small></div>
        <h3>${s.ref} - ${s.title}</h3>
        <div class="loc"><i class="fa-solid fa-location-dot"></i> ${s.loc}</div>
      </div>
    </a>`).join('');

  document.getElementById('propRoot').innerHTML=`
  <div class="wrap" style="padding-top:20px">
    <div class="crumb" style="color:#9aa7ad"><a href="index.html" style="color:var(--navy)">الرئيسية</a> / <a href="${cat.page}" style="color:var(--navy)">${cat.name}</a> / ${p.ref}</div>
    <div class="detail-head">
      <div>
        <div class="detail-badges">${badges}</div>
        <h1>${p.ref} - ${p.title}</h1>
        <div class="loc"><i class="fa-solid fa-location-dot"></i> ${p.loc}</div>
      </div>
      <div class="detail-price">
        <div class="p">${priceLabel}${p.price} ${unit}</div>
        <div class="ref">رقم المرجع: ${p.ref}</div>
      </div>
    </div>
    <div class="gallery">
      <div class="main"><img id="mainImg" src="${imgUrl(p.img)}" alt="${p.title}"></div>
      <div class="thumbs">${thumbHtml}</div>
    </div>
  </div>

  <div class="wrap">
    <div class="detail-grid">
      <div>
        <div class="quickbar">${quick}</div>
        <div class="block"><h2>وصف العقار</h2>${desc}</div>
        <div class="block"><h2>المميزات والخدمات</h2><ul class="amenities">${amen}</ul></div>
        <div class="block"><h2>تفاصيل إضافية</h2><table class="pay-table">${detailRows}</table></div>
        <div class="block"><h2>الموقع</h2>
          <p style="margin-bottom:16px"><i class="fa-solid fa-location-dot" style="color:var(--orange)"></i> ${p.loc}</p>
          <iframe class="map-embed" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${marker}"></iframe>
        </div>
      </div>
      <aside>
        <div class="side-card">
          <div class="agent"><div class="av">F</div><div><b>فريق FloEstates</b><small>مستشار عقاري معتمد</small></div></div>
          <a href="tel:+905496068080" class="btn btn-call"><i class="fa-solid fa-phone"></i> اتصل الآن</a>
          <a href="https://wa.me/905496068080?text=${encodeURIComponent('استفسار عن العقار '+p.ref)}" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> تواصل عبر واتساب</a>
          <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:16px">
            <p style="font-weight:600;color:var(--heading);margin-bottom:12px">اطلب معلومات أكثر</p>
            <form onsubmit="return reqSubmit(event)">
              <input class="form-field" placeholder="الاسم الكامل" required>
              <input class="form-field" placeholder="رقم الهاتف" required>
              <textarea class="form-field" placeholder="رسالتك (اختياري)"></textarea>
              <button type="submit" class="btn"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب</button>
            </form>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <section class="sec">
    <div class="wrap">
      <h2 class="sec-title">عقارات مشابهة</h2>
      <div class="grid-3">${simHtml}</div>
    </div>
  </section>`;

  // re-run reveal animation for newly injected cards
  if(window.IntersectionObserver){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.style.opacity=1;e.target.style.transform='none';io.unobserve(e.target);}}),{threshold:.1});
    document.querySelectorAll('#propRoot .pcard').forEach(el=>{el.style.opacity=0;el.style.transform='translateY(24px)';el.style.transition='.6s ease';io.observe(el);});
  }
})();
function swap(el){document.getElementById('mainImg').src=el.src;document.querySelectorAll('.thumbs img').forEach(i=>i.classList.remove('active'));el.classList.add('active');}
function reqSubmit(e){e.preventDefault();alert('تم إرسال طلبك بنجاح! سيتواصل معك فريق FloEstates قريباً.');e.target.reset();return false;}
</script>
</body>
</html>
